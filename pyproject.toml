[tool.mypy]
# Strict type checking for core packages
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

# Per-module options for packages that may not be fully typed
[[tool.mypy-overrides]]
# Third-party libraries without stubs
module = [
    "langchain*",
    "langgraph*",
    "jobspy*",
    "sentence_transformers*",
    "chromadb*",
    "rapidfuzz*",
    "sklearn*",
    "pydantic_settings",
]
ignore_missing_imports = true

[[tool.mypy-overrides]]
# Allow some flexibility for config files
module = "config.*"
disallow_untyped_defs = false

[[tool.mypy-overrides]]
# Test files can be less strict
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
# Line length
line-length = 100

# Target Python version
target-version = "py311"

# Linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (print statements)
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented code)
    "PL",  # pylint
    "TRY", # tryceratops
]

# Ignore rules that are too noisy for this codebase
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
    "SIM103", # return bool(...) -> use comparison
    "T201",  # print statement (used in CLI)
    "ARG001", # unused method argument (common in ABCs)
    "PTH118", # os.path.join -> pathlib (legacy code)
    "ERA001", # commented code (sometimes useful)
]

# Per-file ignores
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "T201"]
"config/settings.py" = ["ARG002"]

# Formatter
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# isort
[tool.ruff.isort]
known-first-party = ["config", "models", "agents", "tools", "tests"]